name: Tests

# Runs the pytest suite on every push and PR.
# Lints with ruff. Both must pass for the badge to be green.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/assets/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same workflow when a new commit lands.
# Saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest -v --cov=core --cov=cli --cov=server --cov-report=term

      - name: Upload coverage to artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7