<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="axyloid — maintainer automation toolkit">
    <defs>
        <linearGradient id="bg-ax" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0b0d"/>
            <stop offset="100%" stop-color="#16181c"/>
        </linearGradient>
        <linearGradient id="acc-ax" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c89858"/>
            <stop offset="50%" stop-color="#d4a468"/>
            <stop offset="100%" stop-color="#b88848"/>
        </linearGradient>
        <linearGradient id="acc-fade-ax" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c89858" stop-opacity="0"/>
            <stop offset="50%" stop-color="#c89858" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#c89858" stop-opacity="0"/>
        </linearGradient>
        <pattern id="grid-ax" width="22" height="22" patternUnits="userSpaceOnUse">
            <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1a1c20" stroke-width="0.5"/>
        </pattern>
        <pattern id="dot-ax" width="44" height="44" patternUnits="userSpaceOnUse">
            <circle cx="22" cy="22" r="0.9" fill="#1f2126"/>
        </pattern>
        <filter id="glow-ax" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="900" height="240" fill="url(#bg-ax)"/>
    <rect width="900" height="240" fill="url(#dot-ax)" opacity="0.7"/>
    <rect width="900" height="240" fill="url(#grid-ax)" opacity="0.4"/>
    <rect x="0" y="0" width="900" height="1" fill="url(#acc-fade-ax)"/>
    <rect x="0" y="239" width="900" height="1" fill="url(#acc-fade-ax)"/>

    <!-- Left: namespace breadcrumb -->
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace">
        <text x="40" y="38" font-size="11" fill="#5a5249" letter-spacing="1.5">
            <tspan fill="#5a5249">axylith</tspan>
            <tspan fill="#2a2d34" dx="6">/</tspan>
            <tspan fill="url(#acc-ax)" dx="6">axyloid</tspan>
        </text>

        <!-- Main wordmark -->
        <text x="40" y="120" fill="#e8dcc8" font-size="60" font-weight="500" letter-spacing="-1.5">
            axyloid
        </text>

        <!-- Animated build-step indicator instead of editor cursor — fits tooling theme -->
        <g transform="translate(330, 75)">
            <rect x="0" y="0" width="10" height="50" fill="url(#acc-ax)" opacity="0.6">
                <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/>
            </rect>
            <rect x="14" y="0" width="10" height="50" fill="url(#acc-ax)" opacity="0.5">
                <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
            </rect>
            <rect x="28" y="0" width="10" height="50" fill="url(#acc-ax)" opacity="0.4">
                <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
            </rect>
        </g>

        <!-- Tagline -->
        <text x="40" y="158" fill="#a89878" font-size="16" font-weight="400">
            maintainer automation toolkit
        </text>

        <!-- Description -->
        <text x="40" y="186" fill="#7a7268" font-size="11" letter-spacing="0">
            dual-mode bots that run as a GitHub Action or as a hosted GitHub App
        </text>

        <!-- Status strip -->
        <text x="40" y="216" fill="#3a3d44" font-size="10" letter-spacing="1.5">
            <tspan fill="url(#acc-ax)" opacity="0.7">●</tspan>
            <tspan dx="6">PYTHON 3.11+</tspan>
            <tspan dx="12">·</tspan>
            <tspan dx="12">FASTAPI</tspan>
            <tspan dx="12">·</tspan>
            <tspan dx="12">CLOUD RUN</tspan>
            <tspan dx="12">·</tspan>
            <tspan dx="12">APACHE 2.0</tspan>
        </text>
    </g>

    <!-- Right: build-pipeline visual representation -->
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace" opacity="0.55">
        <!-- Webhook arrow path -->
        <text x="555" y="62" font-size="10" fill="#5a7280">// flow</text>

        <g transform="translate(560, 76)">
            <!-- Node 1: GitHub -->
            <rect width="68" height="22" rx="3" fill="#16181c" stroke="#3a3d44" stroke-width="0.8"/>
            <text x="34" y="15" font-size="9" fill="#a8a098" text-anchor="middle">github</text>

            <!-- Arrow 1 -->
            <line x1="68" y1="11" x2="80" y2="11" stroke="#5a5249" stroke-width="0.8"/>
            <polyline points="76,8 80,11 76,14" fill="none" stroke="#5a5249" stroke-width="0.8"/>

            <!-- Node 2: webhook -->
            <rect x="80" y="0" width="76" height="22" rx="3" fill="#16181c" stroke="url(#acc-ax)" stroke-width="0.8"/>
            <text x="118" y="15" font-size="9" fill="#c89858" text-anchor="middle">webhook</text>

            <!-- Arrow 2 -->
            <line x1="156" y1="11" x2="168" y2="11" stroke="#5a5249" stroke-width="0.8"/>
            <polyline points="164,8 168,11 164,14" fill="none" stroke="#5a5249" stroke-width="0.8"/>

            <!-- Node 3: handler -->
            <rect x="168" y="0" width="68" height="22" rx="3" fill="#16181c" stroke="#3a3d44" stroke-width="0.8"/>
            <text x="202" y="15" font-size="9" fill="#a8a098" text-anchor="middle">handler</text>
        </g>

        <text x="555" y="118" font-size="10" fill="#5a7280">// bots</text>
        <text x="555" y="136" font-size="10" fill="#a8a098">stats · axl-diff · validate</text>

        <text x="555" y="162" font-size="10" fill="#5a7280">// modes</text>
        <text x="555" y="180" font-size="10" fill="#a8a098">action + hosted app</text>

        <text x="555" y="206" font-size="10" fill="#5a7280">// runtime</text>
        <text x="555" y="224" font-size="10" fill="#a8a098">cloud run · serverless</text>
    </g>
</svg>