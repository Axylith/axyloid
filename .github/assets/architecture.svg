<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Dual-mode architecture">
    <defs>
        <linearGradient id="bg-arch" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d0e10"/>
            <stop offset="100%" stop-color="#13151a"/>
        </linearGradient>
        <linearGradient id="acc-arch" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c89858"/>
            <stop offset="100%" stop-color="#b88848"/>
        </linearGradient>
        <pattern id="grid-arch" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2126" stroke-width="0.5"/>
        </pattern>
    </defs>

    <rect width="900" height="300" fill="url(#bg-arch)" rx="6"/>
    <rect width="900" height="300" fill="url(#grid-arch)" opacity="0.4"/>

    <text x="30" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#5a5249" letter-spacing="2">
        DUAL-MODE ARCHITECTURE
    </text>
    <line x1="30" y1="42" x2="870" y2="42" stroke="#2a2d34" stroke-width="1"/>

    <g font-family="JetBrains Mono, monospace">
        <!-- Shared core in the middle -->
        <g transform="translate(370, 130)">
            <rect width="160" height="64" rx="6" fill="#16181c" stroke="url(#acc-arch)" stroke-width="1.5"/>
            <text x="80" y="24" font-size="12" fill="#e8dcc8" text-anchor="middle" font-weight="500">core/</text>
            <text x="80" y="42" font-size="9" fill="#c89858" text-anchor="middle" letter-spacing="0.5">shared bot logic</text>
            <text x="80" y="56" font-size="9" fill="#8b8275" text-anchor="middle">stats · axl · validate</text>
        </g>

        <!-- Left arm: GitHub Action mode -->
        <g transform="translate(40, 70)">
            <text x="0" y="18" font-size="10" fill="#5a5249" letter-spacing="1.5">MODE: ACTION</text>
            <rect y="32" width="240" height="50" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
            <text x="120" y="56" font-size="11" fill="#e8dcc8" text-anchor="middle">action/action.yml</text>
            <text x="120" y="70" font-size="9" fill="#8b8275" text-anchor="middle">composite action</text>

            <!-- Arrow down to cli -->
            <line x1="120" y1="82" x2="120" y2="100" stroke="#5a5249" stroke-width="1"/>
            <polyline points="116,96 120,100 124,96" fill="none" stroke="#5a5249" stroke-width="1"/>

            <rect y="110" width="240" height="50" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
            <text x="120" y="134" font-size="11" fill="#e8dcc8" text-anchor="middle">cli/main.py</text>
            <text x="120" y="148" font-size="9" fill="#8b8275" text-anchor="middle">subprocess invocation</text>

            <text x="120" y="184" font-size="9" fill="#5a5249" text-anchor="middle" letter-spacing="0.5">
                runs in user's CI
            </text>
        </g>

        <!-- Right arm: Hosted App mode -->
        <g transform="translate(620, 70)">
            <text x="0" y="18" font-size="10" fill="#5a5249" letter-spacing="1.5">MODE: HOSTED APP</text>
            <rect y="32" width="240" height="50" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
            <text x="120" y="56" font-size="11" fill="#e8dcc8" text-anchor="middle">server/main.py</text>
            <text x="120" y="70" font-size="9" fill="#8b8275" text-anchor="middle">FastAPI webhook</text>

            <line x1="120" y1="82" x2="120" y2="100" stroke="#5a5249" stroke-width="1"/>
            <polyline points="116,96 120,100 124,96" fill="none" stroke="#5a5249" stroke-width="1"/>

            <rect y="110" width="240" height="50" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
            <text x="120" y="134" font-size="11" fill="#e8dcc8" text-anchor="middle">server/handlers/</text>
            <text x="120" y="148" font-size="9" fill="#8b8275" text-anchor="middle">direct module import</text>

            <text x="120" y="184" font-size="9" fill="#5a5249" text-anchor="middle" letter-spacing="0.5">
                runs on cloud run
            </text>
        </g>

        <!-- Arrows from each arm to the core -->
        <!-- Left arrow: from cli to core -->
        <line x1="288" y1="160" x2="368" y2="160" stroke="url(#acc-arch)" stroke-width="1.2" opacity="0.6"/>
        <polyline points="364,156 368,160 364,164" fill="none" stroke="url(#acc-arch)" stroke-width="1.2" opacity="0.6"/>

        <!-- Right arrow: from handlers to core -->
        <line x1="612" y1="160" x2="532" y2="160" stroke="url(#acc-arch)" stroke-width="1.2" opacity="0.6"/>
        <polyline points="536,156 532,160 536,164" fill="none" stroke="url(#acc-arch)" stroke-width="1.2" opacity="0.6"/>
    </g>

    <text x="450" y="270" font-family="JetBrains Mono, monospace" font-size="10" fill="#3a3d44" text-anchor="middle" letter-spacing="1.5">
        BOTH MODES CONVERGE ON THE SAME CORE. ADD A BOT ONCE, IT WORKS EVERYWHERE.
    </text>
</svg>